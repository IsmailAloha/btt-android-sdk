plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '1.8.21'  // ← matches your root kotlin version
}

repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
}

gradlePlugin {
    plugins {
        bttPlugin {
            id = 'com.github.blue-triangle-tech.btt-gradle-plugin'
            implementationClass = 'com.bluetriangle.bttplugin.BttPlugin'
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.blue-triangle-tech'
            artifactId = 'btt-gradle-plugin'
            version = '2.19.5'
        }
    }
    repositories {
        mavenLocal()
    }
}

dependencies {
    compileOnly gradleApi()
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.21"
}